# The two axes every item is tagged on. Edit freely -- classify.py reads this
# file at runtime, so changing the taxonomy means rerunning classify only,
# not refetching anything.

content_type:
  news:        Newsroom item or press release
  research:    Report, study, survey or evidence submission
  policy:      Consultation response, position paper or advocacy submission
  enforcement: Legal action, complaint, regulator referral or company sanction
  review:      Product test, comparison or buying advice
  campaign:    Public campaign, petition or call to action
  blog:        Opinion, commentary or staff blog
  event:       Conference, webinar or announcement of one

# Mirrors the Consumers International programme areas, so the vocabulary
# matches what the network already uses.
topic:
  digital:        Digital rights, data protection, privacy, AI, online platforms
  finance:        Banking, credit, insurance, payments, digital finance
  food:           Food safety, nutrition, labelling, food systems
  energy:         Energy pricing, transition, utilities
  safety:         Product safety, recalls, standards
  sustainability: Sustainable consumption, repair, greenwashing, waste
  scams:          Fraud, scams, misleading advertising
  law:            Consumer law, redress, competition, general consumer rights
  travel:         Air travel, holidays, package rights, transport
  telecoms:       Broadband, mobile, connectivity, postal
  housing:        Housing, renting, home services, tradespeople

# Named front doors for the dashboard. Each is a saved filter.
lenses:
  - id: this_week
    label: This week
    filter: {days: 7}
  - id: digital_finance
    label: Digital finance
    filter: {topics: [finance, digital]}
  - id: enforcement
    label: Enforcement
    filter: {content_types: [enforcement]}
  - id: research
    label: New research
    filter: {content_types: [research, policy]}
  - id: review_queue
    label: Needs review
    filter: {needs_review: true}
